name: service_app
description: A service booking application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Stockage Local
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.8.3

  # UI/UX
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0



 



  # Fonctionnalités
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3

  # Notifications
  flutter_local_notifications: ^19.5.0

  permission_handler: ^11.0.1

  pull_to_refresh: ^2.0.0
  geocoding: ^2.1.1

  flutter_map: ^6.1.0  # Version plus récente
  latlong2: ^0.9.1

  # Formatage & Validation
  intl: ^0.20.2
  validators: ^3.0.0

  # État & Navigation
  provider: ^6.1.1
  get: ^4.6.6

  # Réseau
  dio: ^5.4.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
